<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost & Found</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#f4f7fb;color:#1d2c40;font:15px system-ui,sans-serif} header{background:#142c48;color:white;padding:18px 6%;display:flex;align-items:center;justify-content:space-between;gap:16px} header a{color:white;text-decoration:none} nav{display:flex;align-items:center;gap:16px} main{max-width:1100px;margin:35px auto;padding:0 20px} h1,h2{margin-top:0} .card{background:white;border:1px solid #e0e7ef;border-radius:10px;padding:22px;margin-bottom:18px} .auth{max-width:440px;margin:60px auto} label{display:block;font-weight:600;margin:14px 0 6px} input,select,textarea{width:100%;padding:10px;border:1px solid #bdcbd9;border-radius:6px;font:inherit} textarea{min-height:75px;resize:vertical} button,.button{display:inline-block;background:#1763a5;color:white;border:0;border-radius:6px;padding:10px 16px;font:inherit;text-decoration:none;cursor:pointer} .secondary{background:#53677d} .danger{background:#a43838} .flash{background:#e7f2ff;padding:12px;border-radius:6px;margin-bottom:15px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px} .muted{color:#63758a} .tag{display:inline-block;background:#e7f0f9;border-radius:20px;padding:3px 10px;font-size:13px} .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} .inline{display:inline} .inline button{padding:7px 12px} p{overflow-wrap:anywhere} hr{border:0;border-top:1px solid #e0e7ef;margin:20px 0}
    .dashboard-layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}.dashboard-content{min-width:0}.tabs{display:flex;flex-direction:column;gap:8px}.tabs a{padding:10px 14px;border-radius:6px;background:#e2eaf3;color:#284762;text-decoration:none;font-weight:600}.tabs a.active{background:#1763a5;color:white}.item-photo{width:100%;height:200px;object-fit:contain;background:#f4f7fb;border-radius:6px;margin-bottom:12px}@media(max-width:600px){.dashboard-layout{grid-template-columns:1fr}.tabs{flex-direction:row;flex-wrap:wrap}.tabs a{flex:1 1 40%;text-align:center}}
  </style>
</head>
<body>
<header><a href="{{ url_for('index') }}"><strong>LOST & FOUND</strong></a>{% if session.user_id %}<nav><span>{{ session.username }} · {{ session.role|capitalize }}</span><form class="inline" method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="secondary">Log out</button></form></nav>{% endif %}</header>
<main>{% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
</body></html>
